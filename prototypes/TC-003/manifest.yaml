id: TC-003
status: in_progress
date_built: "2026-04"  # ongoing as of 2026-04-16
description: "Third TwinCl prototype — black welded steel harp, guitar machine head tuners, switch rocker housing, new laser-cut aluminum string combs"
git_tag: proto/TC-003  # TODO: create when build is finalized

photos:
  - media/photos/IMG_6832.jpeg   # Laser-cut aluminum string comb + guitar machine heads at bass end
  - media/photos/IMG_6834.jpeg   # Key-side string guide comb being held (long tapered laser-cut piece)
  - media/photos/IMG_6835.jpeg   # Black U-channel harp frame with guitar tuner machines installed
  - media/photos/IMG_6837.jpeg   # Harp frame with string pitch comb and tuner machines
  - media/photos/IMG_6842.jpeg   # Fully strung harp with guitar tuners, hanging on wall
  - media/photos/IMG_6846.jpeg   # Close-up: tuning head region, guitar machine heads, wooden pin board, printed clip
  - media/photos/IMG_6854.jpeg   # Black U-channel harp interior: wooden string board, laser-cut steel comb
  - media/photos/IMG_6857.jpeg   # Assembled harp on wall, full view
  - media/photos/IMG_6858.jpeg   # Close-up: guitar tuner machines and string routing board
