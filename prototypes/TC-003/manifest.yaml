notes: |
  Harp: Black (powder-coat or paint) welded steel triangular U-channel — same basic
    geometry as TC-002 HarpV2 but distinct finish. Likely irkem_qaxinet_v2.scad.
  Tuning: Guitar machine heads (off-the-shelf tuning pegs) at keyboard/bass end,
    replacing the SupahTunah approach from TC-002. Tuner washers cut for these.
    No fine-tuner printed parts visible; machine heads provide direct tuning.
  String comb: New laser-cut aluminum comb inside harp (irkem_HarpV2StrComb_v1.svg
    or irkem_clavinet_strComb_v2.svg — confirm which was cut).
  Key-side string guide: Long tapered laser-cut piece (IMG_6834) guiding strings
    at the key side. Likely generated by irkem_clavinet_keySideStrGuide_SimpInkScr_v1.py.
  Controls: Switch rocker housing with blue toggle switch (IMG_6859/6860).
    Housing is 3D printed; blue switch is off-the-shelf.
  Keywork: Key design appears similar to TC-002 (same keycap family). Confirm version.
  Electronics: In progress — switch rocker installed, pickup/preamp TBD.

