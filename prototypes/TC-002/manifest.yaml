id: TC-002
status: completed
date_built: "2026-03"  # git log: "TwinCl v2 design files and photos" committed 2026-03-11
description: "Second TwinCl prototype — blue welded steel HarpV2, printed string end block, CST pickup, SupahTunah fine tuner"
git_tag: proto/TC-002  # TODO: create once file list is confirmed

photos:
  - media/photos/TwinCl_v2_leftSide.jpeg
  - media/photos/TwinCl_v2_rightSide.jpeg
  - media/photos/TwinCl_v2_KeyworkDetail.jpeg
  - media/photos/TwinCl_v2_stringEnds.jpeg
  - media/photos/TwinCl_v2_CSTbasedPickup.jpeg
  - media/photos/TwinCl_v2_earPlugMutes.jpeg
  - media/photos/TwinCl_v2_HarpAndBlockPlayout.jpeg
  - media/photos/TwinCl_v2_HarpPUaccessCut.jpeg
  - media/photos/HarpV2.jpeg
  - media/photos/SupahTunah.jpeg

notes: |
  Harp: Blue powder-coated/painted welded steel triangular U-channel (HarpV2).
    Rectangular access cutout added to harp side for pickup adjustment.
    Wooden string-pitch block inside harp with pin layout.
  String end: Printed black PrStrEndBlck_v0 block with multi-hole string routing,
    visible at keyboard end (TwinCl_v2_stringEnds.jpeg).
  Keywork: Orange natural keycaps, black accidentals. Pivot/upstop laser-cut combs
    visible at key front. Printed string guides along key sides.
  Pickup: CST-based bar pickup wrapped in black tape (handmade, no dedicated file).
    Wiring visible in TwinCl_v2_CSTbasedPickup.jpeg.
  Mutes: Foam ear-plug dampers threaded between strings at strike line.
  Tuning: "SupahTunah" device — laser-cut aluminum L-bracket with two threaded
    tuning pins and a clock-key drive (SupahTunah.jpeg). Likely irkem_notATunah_v0.scad
    or a related design; confirm file.
  Electronics: Test wiring visible; no PCB/preamp installed.

