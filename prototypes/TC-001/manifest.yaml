id: TC-001
status: completed
date_built: "2026-01"  # TODO: confirm — git log shows key cap files committed 2026-01-31
description: "First complete TwinCl prototype — wooden chassis, flat harp plate, aluminum extrusion key rails"
git_tag: proto/TC-001  # TODO: create once file list is confirmed

photos:
  - media/photos/TwinCl_v1.jpeg
  - media/photos/TwinCl_v1_open.jpeg
  - media/photos/early_acoustic_play_test.jpeg
  - media/photos/harp_stringing.jpeg
  - media/photos/HarpV2_weldDetail.jpeg      # HarpV2 being fabricated concurrent with this build
  - media/photos/keybed_to_harp_alignment.jpeg
  - media/photos/octave_keyChassis_mockup.jpeg
  - media/photos/TwinCl_Render.png

notes: |
  Chassis: Wood (plywood deck + dimensional lumber frame), no welded steel.
  Harp: Flat plate structure with drilled wooden string pin block — not a welded
    U-channel. No corresponding CAD file identified; may have been hand-laid-out.
    (HarpV2_weldDetail photo shows the blue U-channel being fabricated around this
    same time, likely for TC-002.)
  Keywork: Aluminum extrusion key rails with laser-cut toothed combs. Orange printed
    natural keycaps, black printed accidentals.
  String end: Drilled wooden block — no printed PrStrEndBlck used.
  Electronics: None installed in this build.
  Tuning: Manual tuning pins only, no fine-tuner device.

